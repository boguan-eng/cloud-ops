# Shared apply build (push-to-main trigger, approval required). Substitutions come from the
# trigger (see stages/0-bootstrap/cicd.tf): _STAGE_DIR, _STAGE_KEY, _STATE_BUCKET, _BUILDER_IMAGE.
# - No secrets in substitutions; real tfvars are fetched from the state bucket.
# - Logs stay in Cloud Logging (CLOUD_LOGGING_ONLY); they are not sent to GitHub.
# - The apply SA can write the state lock, so apply uses the default locking.
steps:
  - id: fetch-tfvars
    name: ${_BUILDER_IMAGE}
    entrypoint: gcloud
    dir: ${_STAGE_DIR}
    args:
      - storage
      - cp
      - gs://${_STATE_BUCKET}/tfvars/${_STAGE_KEY}/terraform.tfvars
      - terraform.tfvars

  - id: init
    name: ${_BUILDER_IMAGE}
    entrypoint: tofu
    dir: ${_STAGE_DIR}
    args: [init, -input=false, "-backend-config=bucket=${_STATE_BUCKET}"]

  - id: plan
    name: ${_BUILDER_IMAGE}
    entrypoint: tofu
    dir: ${_STAGE_DIR}
    args: [plan, -input=false, -no-color, -out=tfplan]

  - id: apply
    name: ${_BUILDER_IMAGE}
    entrypoint: tofu
    dir: ${_STAGE_DIR}
    args: [apply, -input=false, -no-color, tfplan]

options:
  logging: CLOUD_LOGGING_ONLY
